- id: pilot-delivery
  value: >-
    Free, self-hosted CLI. Install it yourself (`uv tool install
    patchward`) and run it with your own Anthropic API key and GitHub
    token — your code and credentials never pass through Patchward's own
    infrastructure. There is no hosted service, no paid tier, and no
    sales process.
  verified: 2026-09-11
  source: >-
    Decision made 2026-09-11 (Yehor Kaliberda): Patchward licensed MIT
    and the paid GitHub Marketplace / hosted-webhook path formally
    dropped in favor of staying a free, self-hosted tool. Confirmed
    against the LICENSE file and the `license` field added to
    pyproject.toml the same date. Supersedes the prior entry, which
    described the pre-decision pilot-delivery state (Yehor running the
    CLI manually against a customer's repository) — that was accurate
    as of 2026-08-11 and is not retracted, just superseded.

- id: gate-3-behavior
  value: >-
    Runs against your real test suite in the normal (CLI-delivered)
    case. On the hosted webhook path, when no test runner is present,
    Gate 3 skips and the PR discloses this explicitly rather than
    proceeding silently or failing the whole fix.
  verified: 2026-08-11
  source: "webhook.py / pipeline.py source, §5/C2 decision (2026-08-01), build doc D7 + D8 + Decision 9"

- id: anthropic-data-boundary
  value: >-
    The triage and fix-generation stages send repository file contents
    to the Anthropic API to do their work. Credential scrubbing applies
    to Patchward's own CLI output and logs — not to what is sent to
    Anthropic.
  verified: 2026-08-11
  source: "credential_proxy.py / fix_gen.py source trace, build doc D11"

- id: install-command
  value: "uv tool install patchward"
  verified: 2026-08-11
  source: "callmedai.com live copy, cross-checked against real patchward --help output"

