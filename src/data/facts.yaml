- id: gate-3-behavior
  value: >-
    Runs against your real test suite in the normal (CLI-delivered)
    case. On the hosted webhook path, when no test runner is present,
    Gate 3 skips and the PR discloses this explicitly rather than
    proceeding silently or failing the whole fix.
  verified: 2026-08-11
  source: "webhook.py / pipeline.py source, §5/C2 decision (2026-08-01), build doc D7 + D8 + Decision 9"

- id: anthropic-data-boundary
