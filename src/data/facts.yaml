# The canonical claims file (governance chapter §12.1/§12.3 of the
# lookbook — patchward_lookbook_v1_2026-08-11.md). Every dated fact the
# site states pulls from here. Nothing gets hand-copied into a page —
# that discipline is the direct structural fix for the class of bug
# this project has hit repeatedly: the "371 tests" staleness, the
# RepoMend branding leak, the mismatched mpfb2 proof link. If it isn't
# here, it doesn't get stated as fact anywhere on the site.
#
# Every entry carries `verified` (date) and `source` — no fact ships
# without a traceable origin, and staleness is visible by inspection
# rather than silent.

- id: test-count
  value: "565 passed, 3 skipped"
